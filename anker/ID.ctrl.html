}
.text-\[var\(--neon\)\] {
  color: var(--neon);
}
.text-\[var\(--neon-soft\)\] {
  color: var(--neon-soft);
}
.text-black {
  --tw-text-opacity: 1;
  color: rgb(0 0 0 / var(--tw-text-opacity, 1));
}
.line-through {
  text-decoration-line: line-through;
}
.opacity-50 {
  opacity: 0.5;
}
.filter {
  filter: var(--tw-blur) var(--tw-brightness) var(--tw-contrast) var(--tw-grayscale) var(--tw-hue-rotate) var(--tw-invert) var(--tw-saturate) var(--tw-sepia) var(--tw-drop-shadow);
}
:root {
  --bg: #000000;
  --surface: #050805;
  --surface-2: #0a120a;
  --surface-3: #0d1a0d;
  --line: #1c2b1c;
  --line-bright: #2f4a2f;
  --neon: #00ff00;
  --neon-soft: #4dff4d;
  --neon-dim: #0a8f0a;
  --ink: #d9ffd9;
  --muted: #7da37d;
  --faint: #4a6b4a;
  --danger: #ff5f5f;
  --amber: #ffd23f;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #000000;
    --surface: #050805;
    --surface-2: #0a120a;
    --surface-3: #0d1a0d;
    --line: #1c2b1c;
    --line-bright: #2f4a2f;
    --neon: #00ff00;
    --neon-soft: #4dff4d;
    --neon-dim: #0a8f0a;
    --ink: #d9ffd9;
    --muted: #7da37d;
    --faint: #4a6b4a;
    --danger: #ff5f5f;
    --amber: #ffd23f;
  }
}
html {
  background: var(--bg);
}
body {
  background: var(--bg);
  color: var(--ink);
  font-family: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas,
    "Liberation Mono", "Courier New", monospace;
  -webkit-font-smoothing: antialiased;
}
::-moz-selection {
  background: var(--neon);
  color: #000;
}
::selection {
  background: var(--neon);
  color: #000;
}
.neon-glow {
  text-shadow: 0 0 6px rgba(0, 255, 0, 0.55), 0 0 22px rgba(0, 255, 0, 0.25);
}
.gold-glow {
  text-shadow: 0 0 6px rgba(255, 210, 63, 0.55), 0 0 22px rgba(255, 210, 63, 0.25);
}
.room-grid-bg {
  background-image:
    linear-gradient(rgba(0, 255, 0, 0.05) 1px, transparent 1px),
    linear-gradient(90deg, rgba(0, 255, 0, 0.05) 1px, transparent 1px);
  background-size: 28px 28px;
}
.scanlines {
  background-image: repeating-linear-gradient(
    0deg,
    rgba(0, 255, 0, 0.025) 0px,
    rgba(0, 255, 0, 0.025) 1px,
    transparent 1px,
    transparent 4px
  );
}
@keyframes blinkdot {
  0%, 100% {
    opacity: 1;
  }
  50% {
    opacity: 0.25;
  }
}
.blink {
  animation: blinkdot 1.6s steps(2, start) infinite;
}
input, select, textarea {
  font-family: inherit;
}
input:focus, select:focus, button:focus-visible {
  outline: 1px solid var(--neon);
  outline-offset: 1px;
}
.hover\:bg-\[var\(--amber\)\]:hover {
  background-color: var(--amber);
}
.hover\:bg-\[var\(--neon\)\]:hover {
  background-color: var(--neon);
}
.hover\:bg-\[var\(--surface-3\)\]:hover {
  background-color: var(--surface-3);
}
.hover\:text-\[var\(--danger\)\]:hover {
  color: var(--danger);
}
.hover\:text-\[var\(--neon\)\]:hover {
  color: var(--neon);
}
.hover\:text-black:hover {
  --tw-text-opacity: 1;
  color: rgb(0 0 0 / var(--tw-text-opacity, 1));
}
.disabled\:opacity-40:disabled {
  opacity: 0.4;
}
